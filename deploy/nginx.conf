# UniSub 独立 Nginx — 由 Supervisor 管理
# 与主机 nginx 完全隔离，独立 PID / 日志 / 端口

user hermes;
worker_processes 1;
pid /tmp/nginx-unisub.pid;
error_log /home/hermes/projects/unisub/logs/nginx-error.log;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    access_log  /home/hermes/projects/unisub/logs/nginx-access.log;

    server {
        listen 8082;
        server_name _;

        root /home/hermes/projects/unisub/frontend/dist;
        index index.html;

        # API 代理到后端
        location /api/ {
            proxy_pass http://127.0.0.1:8002/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # SPA 路由 fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    }
}
