; UniSub — Supervisor 子进程配置
; 安装方式：
;   sudo ln -sf /home/hermes/projects/unisub/deploy/supervisor.conf /etc/supervisor/conf.d/unisub.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; 状态查看：
;   sudo supervisorctl status
;   sudo supervisorctl tail -f unisub:backend

; 注意：program 名在 supervisor 中是全局命名空间，多个项目的 conf 会被同一个
; supervisord 一并加载。裸名 backend/frontend 会与 confirmation 等其他项目冲突
; （后加载的覆盖先加载的，导致整组跑错配置），故统一加 unisub_ 前缀保证唯一。

[group:unisub]
programs=unisub_backend,unisub_frontend

[program:unisub_backend]
command=/home/hermes/projects/unisub/deploy/start-api.sh
directory=/home/hermes/projects/unisub/backend
user=hermes
autostart=true
autorestart=true
startretries=3
stopsignal=INT
stopwaitsecs=10
stdout_logfile=/home/hermes/projects/unisub/logs/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/hermes/projects/unisub/logs/backend.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:unisub_frontend]
command=/usr/sbin/nginx -c /home/hermes/projects/unisub/deploy/nginx.conf -g 'daemon off;'
user=root
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/home/hermes/projects/unisub/logs/frontend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/hermes/projects/unisub/logs/frontend.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3